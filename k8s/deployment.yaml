apiVersion: apps/v1
kind: Deployment
metadata:
  name: adapt-api
  labels:
    app: adapt
    component: api
    version: v3.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: adapt
      component: api
  template:
    metadata:
      labels:
        app: adapt
        component: api
        version: v3.0
    spec:
      containers:
      - name: adapt
        image: adapt:3.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: ADAPT_ENV
          value: "production"
        - name: ADAPT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: adapt-secrets
              key: secret-key
        - name: NEO4J_URI
          valueFrom:
            secretKeyRef:
              name: adapt-secrets
              key: neo4j-uri
        - name: NEO4J_USER
          valueFrom:
            secretKeyRef:
              name: adapt-secrets
              key: neo4j-user
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: adapt-secrets
              key: neo4j-password
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: adapt-secrets
              key: slack-bot-token
              optional: true
        - name: PAGERDUTY_API_KEY
          valueFrom:
            secretKeyRef:
              name: adapt-secrets
              key: pagerduty-api-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: adapt-secrets
              key: anthropic-api-key
              optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      securityContext:
        fsGroup: 1000
